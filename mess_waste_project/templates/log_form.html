{% extends 'base.html' %}
{% block title %}Record waste | Mess Waste Tracker{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold text-navy mt-0 mb-5">Record Meal Waste</h1>
<form method="post" class="max-w-[520px]">
  <label for="dish_id" class="block mt-2.5 mb-1 font-bold text-sm">Dish</label>
  <select id="dish_id" name="dish_id" class="w-full p-2 border border-[#b8c6c2] rounded text-sm">{% for d in dishes %}<option value="{{ d._id }}" {{ 'selected' if form.get('dish_id') == d._id|string }}>{{ d.name }}</option>{% endfor %}</select>

  <label for="date" class="block mt-2.5 mb-1 font-bold text-sm">Date</label>
  <input id="date" name="date" type="date" required value="{{ form.get('date', today) }}" class="w-full p-2 border border-[#b8c6c2] rounded text-sm">

  <label for="meal_type" class="block mt-2.5 mb-1 font-bold text-sm">Meal</label>
  <select id="meal_type" name="meal_type" class="w-full p-2 border border-[#b8c6c2] rounded text-sm">{% for m in MEALS %}<option value="{{ m }}" {{ 'selected' if form.get('meal_type') == m }}>{{ m }}</option>{% endfor %}</select>

  <label for="hostel_block" class="block mt-2.5 mb-1 font-bold text-sm">Hostel block</label>
  <select id="hostel_block" name="hostel_block" class="w-full p-2 border border-[#b8c6c2] rounded text-sm">{% for b in BLOCKS %}<option value="{{ b }}" {{ 'selected' if form.get('hostel_block') == b }}>{{ b }}</option>{% endfor %}</select>

  <label for="prepared_kg" class="block mt-2.5 mb-1 font-bold text-sm">Prepared (kg)</label>
  <input id="prepared_kg" name="prepared_kg" type="number" step="0.1" required value="{{ form.get('prepared_kg','') }}" class="w-full p-2 border border-[#b8c6c2] rounded text-sm">

  <label for="wasted_kg" class="block mt-2.5 mb-1 font-bold text-sm">Wasted (kg)</label>
  <input id="wasted_kg" name="wasted_kg" type="number" step="0.1" required value="{{ form.get('wasted_kg','') }}" class="w-full p-2 border border-[#b8c6c2] rounded text-sm">

  <label for="students_served" class="block mt-2.5 mb-1 font-bold text-sm">Students served</label>
  <input id="students_served" name="students_served" type="number" required value="{{ form.get('students_served','') }}" class="w-full p-2 border border-[#b8c6c2] rounded text-sm">

  <p class="my-3 text-muted">No browser limits are set on purpose: MongoDB itself rejects wasted kg above prepared kg.</p>
  <p class="my-4 flex gap-2">
    <button type="submit" class="inline-block bg-brand text-white px-4 py-2 rounded text-sm cursor-pointer hover:opacity-90">Save log</button>
    <a href="{{ url_for('logs') }}" class="inline-block bg-accent text-white px-4 py-2 rounded text-sm no-underline hover:opacity-90">Cancel</a>
  </p>
</form>
{% endblock %}
